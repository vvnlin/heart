<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>觀心書 ｜ 上傳即時看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 溫潤文藝色調 */
      --bg-base: #f7f6f2;
      --card-bg: #ffffff;
      --primary: #475569;
      --text-main: #2c3338;
      --text-muted: #828a92;
      --accent: #d97736; /* 溫暖陶土琥珀色 */
      
      /* 已上傳狀態：柔和鼠尾草綠 */
      --success-bg: #f2f7f4;
      --success-border: #86b29b;
      --success-text: #2d5a43;
      --success-badge: #e3ede7;
      
      --border-color: #eae7e1;
      --shadow-sm: 0 2px 8px rgba(44, 51, 56, 0.04);
      --shadow-md: 0 8px 24px rgba(44, 51, 56, 0.07);
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }

    body { 
      background-color: var(--bg-base); 
      margin: 0; 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center; 
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .app-card { 
      background: var(--card-bg); 
      width: 100%; 
      max-width: 480px; 
      border-radius: 24px; 
      padding: 24px 20px; 
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(220, 215, 206, 0.5);
    }

    /* 頂部標題區 */
    .header { text-align: center; margin-bottom: 18px; }
    .header h1 { 
      font-family: "Noto Serif TC", serif;
      font-size: 23px; 
      letter-spacing: 2px;
      margin: 0 0 8px 0; 
      color: #26292b; 
      font-weight: 700;
    }
    .status-badge { 
      display: inline-flex; 
      align-items: center; 
      gap: 7px; 
      font-size: 11.5px; 
      font-weight: 500; 
      padding: 4px 12px; 
      border-radius: 30px; 
      background: #f1eee9;
      color: #716b64;
      letter-spacing: 0.5px;
    }
    .dot { 
      width: 6.5px; 
      height: 6.5px; 
      border-radius: 50%; 
      background: #4ade80; 
      box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
      animation: pulse 2s infinite ease-in-out; 
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }

    /* 統計狀態橫幅 */
    .stat-banner { 
      background: #faf9f6; 
      border: 1px solid var(--border-color);
      border-radius: 16px; 
      padding: 14px 18px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
    }
    .stat-banner .date-info { display: flex; flex-direction: column; }
    .stat-banner .date-title { 
      font-family: "Noto Serif TC", serif;
      font-size: 15px; 
      font-weight: 700; 
      color: var(--text-main); 
      letter-spacing: 0.5px;
    }
    .stat-banner .date-sub { 
      font-size: 11.5px; 
      color: var(--text-muted); 
      margin-top: 3px; 
      font-weight: 400;
    }
    .stat-banner .count { 
      font-size: 15px; 
      font-weight: 700; 
      color: var(--accent); 
      background: #fcf4ed;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #fae2cf;
    }

    /* 搜尋框 */
    .search-input { 
      width: 100%; 
      padding: 12px 16px; 
      border: 1px solid var(--border-color); 
      background: #faf9f6;
      border-radius: 14px; 
      font-size: 14.5px; 
      outline: none; 
      margin-bottom: 12px; 
      transition: all 0.2s ease;
      color: var(--text-main);
    }
    .search-input:focus { 
      background: #ffffff;
      border-color: #b0aba2; 
      box-shadow: 0 0 0 3px rgba(176, 171, 162, 0.15);
    }
    .search-input::placeholder { color: #a8a29e; }

    /* 分組分頁 */
    .tabs { 
      display: flex; 
      gap: 6px; 
      margin-bottom: 16px; 
      overflow-x: auto; 
      padding-bottom: 2px; 
    }
    .tab-btn { 
      flex: 1; 
      padding: 8px 0; 
      border: 1px solid var(--border-color); 
      background: #ffffff; 
      border-radius: 12px; 
      font-size: 12.5px; 
      font-weight: 500; 
      color: var(--text-muted); 
      cursor: pointer; 
      text-align: center; 
      white-space: nowrap; 
      transition: all 0.2s;
    }
    .tab-btn.active { 
      background: #2c3338; 
      color: #f7f6f2; 
      border-color: #2c3338; 
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* 名單格線 */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 10px; 
      max-height: 480px; 
      overflow-y: auto; 
      padding: 2px; 
    }
    .person-card {
      border: 1px solid var(--border-color); 
      border-radius: 14px; 
      padding: 13px 8px; 
      text-align: center; 
      cursor: pointer;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      gap: 4px; 
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      background: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .person-card:hover {
      border-color: #d1cbc1;
      transform: translateY(-1px);
    }
    .person-card:active { 
      transform: scale(0.97); 
    }
    .person-name { 
      font-size: 15.5px; 
      font-weight: 600; 
      color: var(--text-main); 
      letter-spacing: 0.5px;
    }
    .person-status { 
      font-size: 11px; 
      color: #9c978f; 
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* 已上傳狀態（質樸鼠尾草綠） */
    .person-card.checked { 
      background: var(--success-bg); 
      border-color: var(--success-border); 
      box-shadow: none;
    }
    .person-card.checked .person-name { 
      color: var(--success-text); 
    }
    .person-card.checked .person-status { 
      color: var(--success-text); 
      font-weight: 600; 
      background: var(--success-badge);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 底部操作區 */
    .footer { 
      margin-top: 18px; 
      padding-top: 16px; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      gap: 9px; 
    }
    .copy-btn {
      width: 100%; 
      background: #33393e; 
      color: #faf9f6; 
      border: none; 
      padding: 13px; 
      border-radius: 12px;
      font-size: 13.5px; 
      font-weight: 600; 
      letter-spacing: 0.5px;
      cursor: pointer; 
      text-align: center;
      box-shadow: 0 4px 12px rgba(44, 51, 56, 0.12);
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #1f2326; }
    .reset-btn {
      width: 100%; 
      background: transparent; 
      color: #a8a29e; 
      border: 1px dashed #d6d3d1; 
      padding: 8px; 
      border-radius: 10px;
      font-size: 11.5px; 
      cursor: pointer; 
      text-align: center;
      transition: all 0.2s;
    }
    .reset-btn:hover { color: #dc2626; border-color: #fca5a5; background: #fff5f5; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <h1>觀心書</h1>
    <div class="status-badge"><div class="dot"></div> 即時線上同步中</div>
  </div>

  <div class="stat-banner">
    <div class="date-info">
      <span class="date-title" id="displayCycle">載入中...</span>
      <span class="date-sub" id="displayDeadline"></span>
    </div>
    <span class="count" id="displayCount">0 / 27 人已上傳</span>
  </div>

  <input type="text" class="search-input" id="searchBox" placeholder="🔍 快速搜尋夥伴姓名..." oninput="renderGrid()">

  <div class="tabs">
    <button class="tab-btn active" onclick="switchGroup('ALL', this)">全部 (27)</button>
    <button class="tab-btn" onclick="switchGroup(1, this)">第 1 組 (10人)</button>
    <button class="tab-btn" onclick="switchGroup(2, this)">第 2 組 (10人)</button>
    <button class="tab-btn" onclick="switchGroup(3, this)">第 3 組 (7人)</button>
  </div>

  <div class="grid" id="memberGrid">名冊同步中...</div>

  <div class="footer">
    <button class="copy-btn" onclick="copyUnfinishedList()">📋 一鍵複製今日未上傳名單</button>
    <button class="reset-btn" onclick="clearLocalCache()">🧹 清除本機快取（若試算表已刪除紀錄請按此）</button>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwQdsFfncH1TrAi7HSVN93JD5Zqac2B1r2dlC4lahFq9DqpiytAD9IMWjec_0oOEr1G2Q/exec";

  // 27 位夥伴名冊（更新張莃澄，維持 10 人一組結構）
  const MEMBERS = [
    // 第 1 組（10人）
    { group: 1, name: "陳潔怡" }, { group: 1, name: "朱傳慧" }, { group: 1, name: "廖麒涵" },
    { group: 1, name: "林心怡" }, { group: 1, name: "何淑菁" }, { group: 1, name: "王士誠" },
    { group: 1, name: "李詠潔" }, { group: 1, name: "廖振廷" }, { group: 1, name: "李芷緹" }, { group: 1, name: "許承澤" },
    // 第 2 組（10人）
    { group: 2, name: "羅景顥" }, { group: 2, name: "林恩安" }, { group: 2, name: "蔣昀穎" },
    { group: 2, name: "張莃澄" }, { group: 2, name: "洪鈺婷" }, { group: 2, name: "岑浣禎" },
    { group: 2, name: "李治徵" }, { group: 2, name: "蔡佳格" }, { group: 2, name: "林語婕" }, { group: 2, name: "陳綵潔" },
    // 第 3 組（7人）
    { group: 3, name: "蔡佳君" }, { group: 3, name: "陳香菱" }, { group: 3, name: "韓雅怡" },
    { group: 3, name: "鄭英惠" }, { group: 3, name: "林妏憓" }, { group: 3, name: "林姿伶" }, { group: 3, name: "黃宏昌" }
  ];

  // 計算中午 12:00 換日週期
  function getCycleInfo() {
    const now = new Date();
    const todayNoon = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12, 0, 0);
    let targetDate, deadlineDate;

    if (now < todayNoon) {
      targetDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      deadlineDate = todayNoon;
    } else {
      targetDate = now;
      deadlineDate = new Date(todayNoon.getTime() + 24 * 60 * 60 * 1000);
    }

    const pad = (n) => String(n).padStart(2, '0');
    const targetKey = `${targetDate.getFullYear()}-${pad(targetDate.getMonth() + 1)}-${pad(targetDate.getDate())}`;
    const targetLabel = `${pad(targetDate.getMonth() + 1)}/${pad(targetDate.getDate())} 觀心書`;
    const deadlineLabel = `截止：${pad(deadlineDate.getMonth() + 1)}/${pad(deadlineDate.getDate())} 12:00`;

    return { targetKey, targetLabel, deadlineLabel, storageKey: "hw_checked_" + targetKey };
  }

  const cycle = getCycleInfo();
  let currentGroup = 'ALL';
  let checkedNames = [];

  window.onload = function() {
    document.getElementById('displayCycle').innerText = cycle.targetLabel;
    document.getElementById('displayDeadline').innerText = cycle.deadlineLabel;
    renderGrid();
    syncWithCloud();
    setInterval(syncWithCloud, 3500);
  };

  function callGAS(params, callback) {
    const cbName = "gas_cb_" + Math.round(1000000 * Math.random());
    window[cbName] = function(data) {
      try {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      } catch(e) {}
      if (callback) callback(data);
    };

    const query = new URLSearchParams(params);
    query.set("callback", cbName);
    query.set("_t", Date.now()); // 防瀏覽器快取

    const script = document.createElement("script");
    script.src = `${GAS_API_URL}?${query.toString()}`;
    document.body.appendChild(script);
  }

  // 100% 依據試算表真實資料同步
  function syncWithCloud() {
    callGAS({ action: "getList", targetDate: cycle.targetKey }, function(res) {
      if (res && res.success && Array.isArray(res.list)) {
        checkedNames = res.list;
        localStorage.setItem(cycle.storageKey, JSON.stringify(checkedNames));
        renderGrid();
      }
    });
  }

  function renderGrid() {
    const grid = document.getElementById('memberGrid');
    const query = document.getElementById('searchBox').value.trim().toLowerCase();

    const filtered = MEMBERS.filter(m => {
      const matchG = (currentGroup === 'ALL' || m.group === currentGroup);
      const matchS = m.name.toLowerCase().includes(query);
      return matchG && matchS;
    });

    grid.innerHTML = filtered.map(m => {
      const isDone = checkedNames.includes(m.name);
      return `
        <div class="person-card ${isDone ? 'checked' : ''}" onclick="handleClickName('${m.name}')">
          <span class="person-name">${m.name}</span>
          <span class="person-status">${isDone ? '🌿 已上傳' : '點擊回報已上傳'}</span>
        </div>
      `;
    }).join('');

    document.getElementById('displayCount').innerText = `${checkedNames.length} / ${MEMBERS.length} 人已上傳`;
  }

  function switchGroup(g, btn) {
    currentGroup = g;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function handleClickName(name) {
    if (checkedNames.includes(name)) {
      alert(`${name} 已經回報上傳過囉！`);
      return;
    }

    if (confirm(`確認「${name}」已上傳【${cycle.targetLabel}】並登記？`)) {
      // 樂觀預先更新
      if (!checkedNames.includes(name)) {
        checkedNames.push(name);
      }
      renderGrid();

      // 雲端寫入試算表
      callGAS({ action: "checkIn", targetDate: cycle.targetKey, name: name }, function(res) {
        if (res && res.success && res.list) {
          checkedNames = res.list;
          localStorage.setItem(cycle.storageKey, JSON.stringify(checkedNames));
          renderGrid();
        }
      });

      // 溫暖的確認鼓勵語
      alert(`「準時上傳的你，很棒！」✨`);
    }
  }

  function copyUnfinishedList() {
    const unDone = MEMBERS.filter(m => !checkedNames.includes(m.name)).map(m => m.name);
    if (unDone.length === 0) {
      alert(`🎉 太棒了！【${cycle.targetLabel}】全員皆已完成上傳！`);
      return;
    }
    const text = `📢 【${cycle.targetLabel} 上傳提醒】（${cycle.deadlineLabel}）\n尚未完成上傳夥伴（共 ${unDone.length} 人）：\n` + unDone.join('、');
    navigator.clipboard.writeText(text).then(() => {
      alert("已成功複製未上傳名單！可直接貼至 LINE 群組叮嚀。");
    });
  }

  function clearLocalCache() {
    localStorage.clear();
    checkedNames = [];
    renderGrid();
    syncWithCloud();
    alert("已清空本機快取！畫面已與試算表重新同步。");
  }
</script>

</body>
</html>
